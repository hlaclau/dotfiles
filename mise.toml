[tasks."brew:install"]
description = "Install packages from Brewfile"
run = "brew bundle install --file=.config/homebrew/Brewfile"

[tasks.stow]
description = "Stow all dotfiles"
run = "stow ."

[tasks."stow:restow"]
description = "Restow all dotfiles (refresh symlinks)"
run = "stow --restow ."

[tasks."scripts:macos-utilities"]
description = "Apply macOS utility defaults (Finder, trackpad, keyboard)"
run = "sh scripts/macos-utilities.sh"
