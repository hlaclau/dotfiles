# OmniWM settings, ported from arch/.config/hypr (hyprland.lua + bindings.lua)
# Reference: https://omniwm.app/config/settings-reference/
#
# The schema is strict: every key below is required unless the reference says
# optional, and [[hotkeys]] must list every action exactly once. Change values
# in place. Saving from OmniWM's Settings window rewrites this file and drops
# these comments.

schemaVersion = 4

# Per-monitor overrides (none yet; Settings > Monitors fills these in)
monitorBarOverrides = []
monitorOrientationOverrides = []
monitorNiriOverrides = []
monitorDwindleOverrides = []
monitorGapOverrides = []

[general]
hotkeysEnabled = true
systemHyperTrigger = "None"
hyperKeyModifiers = "Control+Option+Shift+Command"
defaultLayoutType = "dwindle" # general.layout = "dwindle"
preventSleepEnabled = false
updateChecksEnabled = true
ipcEnabled = false
animationsEnabled = true

[focus]
followsMouse = true # input.follow_mouse = 1
raiseOnMouseFocus = true
lockModifier = "off"
moveMouseToFocusedWindow = false
followsWindowToMonitor = false
crossesMonitorAtEdge = true
moveCrossesMonitorAtEdge = true

[mouseWarp]
margin = 1
enabled = true
constrainToArrangement = false

[routing]
mode = "macOS"
arrangements = []

# gaps_in = 5 (per window side, so 10 between windows), gaps_out = 20.
# outer.top is measured from the top of the screen and the menu bar height is
# subtracted from it, so 57 leaves about 20 under the notched MacBook menu bar.
[gaps]
size = 10.0
fullscreenUsesOuterGaps = false

[gaps.outer]
left = 20.0
right = 20.0
top = 57.0
bottom = 20.0

[niri]
visibleContainerCount = 2
infiniteLoop = false
centerFocusedColumn = "never"
alwaysCenterSingleColumn = false
singleWindowFit = "fill"

[dwindle]
smartSplit = false
defaultSplitRatio = 1.0
splitWidthMultiplier = 1.0
singleWindowFit = "fill"
useGlobalGaps = true
moveToRootStable = true

# border_size = 2, active_border = catppuccin lavender
[borders]
enabled = true
width = 2.0
color = { red = 0.7059, green = 0.7451, blue = 0.9961, alpha = 0.9333 }

[overview]
zoom = 1.0
backdrop = { red = 0.0667, green = 0.0667, blue = 0.1059, alpha = 1.0000 }

[overview.windowBorders]
normal = { red = 0.2706, green = 0.2784, blue = 0.3529, alpha = 0.6667 }
hovered = { red = 0.7059, green = 0.7451, blue = 0.9961, alpha = 1.0000 }
selected = { red = 0.6510, green = 0.8902, blue = 0.6314, alpha = 1.0000 }

[workspaceBar]
enabled = false # off: the workspace number shows next to the menu bar icon instead
showLabels = true
showFloatingWindows = false
windowLevel = "popup"
position = "overlappingMenuBar"
notchMode = "fillLeftOfNotch"
notchActiveZoneWidth = 180.0
systemStatsButton = false
deduplicateAppIcons = false
hideEmptyWorkspaces = true # waybar only shows workspaces that exist
excludedBundleIDs = []
reserveLayoutSpace = false
revealModifier = "off"
revealHoldMilliseconds = 200.0
hideInNativeFullscreen = false
height = 24.0
backgroundOpacity = 0.1
transparentBackground = false
solidBlackBackground = false
showItemBackgrounds = true
showAccentHighlights = true
xOffset = 0.0
yOffset = 0.0
accentColor = { red = 0.7059, green = 0.7451, blue = 0.9961, alpha = 1.0000 }
textColor = { red = 0.8039, green = 0.8392, blue = 0.9569, alpha = 1.0000 }

[workspaceBar.iconOverrides]

# Super + left drag moves, Super + right drag resizes
[gestures]
scrollEnabled = true
scrollSensitivity = 5.0
scrollModifierKey = "optionShift"
mouseMoveModifierKey = "option"
mouseResizeModifierKey = "option"
fingerCount = 3
invertDirection = true
trackpadScrollStyle = "snap"
workspaceSwipeEnabled = false
workspaceSwipeFingerCount = 3
workspaceSwipeAxis = "vertical"

[statusBar]
showWorkspaceName = true
showAppNames = false
useWorkspaceId = true

[hiddenBar]
enabled = true
hiddenBundleIDs = []
rehideIntervalSeconds = 5.0

# cliphist replacement: Option+Space, then Cmd+3
[clipboard]
historyEnabled = true
maxItems = 200
maxItemBytes = 8388608
maxTotalBytes = 67108864
ignoredTypes = []

# The special:scratch drop-down terminal. It runs Ghostty and reads its config.
[quakeTerminal]
enabled = true
position = "top"
widthPercent = 80.0
heightPercent = 50.0
animationDuration = 0.2
autoHide = false
backgroundEffect = "standardBlur"
monitorMode = "focusedWindow"

[scratchpads.labels]

[appearance]
mode = "dark"
tabRailAppIcons = false

