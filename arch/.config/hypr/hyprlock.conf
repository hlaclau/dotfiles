# Lock screen in the island's style: blurred desktop, a notch at the top,
# big clock, now playing and a pill password field. Catppuccin Mocha.
# Wiki: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font = SFMono Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

background {
    monitor =
    path = screenshot
    color = rgba(11111bff)
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.17
    noise = 0.01
}

# ---- Notch, hanging from the top edge like the island ----
# Taller than visible: the top is pushed off-screen so only the bottom corners show
shape {
    monitor =
    size = 200, 56
    color = rgba(11111bff)
    rounding = 18
    position = 0, 20
    halign = center
    valign = top
}

label {
    monitor =
    text = <span foreground="##cba6f7"></span>  Locked
    color = rgba(cdd6f4ff)
    font_size = 12
    font_family = $font
    position = 0, -9
    halign = center
    valign = top
}

# ---- Clock ----
label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 110
    font_family = $font Bold
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = rgba(a6adc8ff)
    font_size = 18
    font_family = $font
    position = 0, 85
    halign = center
    valign = center
}

# ---- Password ----
label {
    monitor =
    text = <span foreground="##cba6f7"></span>  $USER
    color = rgba(bac2deff)
    font_size = 13
    font_family = $font
    position = 0, -5
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = -1
    outer_color = rgba(cba6f7ee)
    inner_color = rgba(11111bdd)
    font_color = rgba(cdd6f4ff)
    font_family = $font
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086">Password</span>
    check_color = rgba(f9e2afee)
    fail_color = rgba(f38ba8ee)
    fail_text = <span foreground="##f38ba8">$FAIL</span>
    capslock_color = rgba(fab387ee)
    position = 0, -60
    halign = center
    valign = center
}

# ---- Now playing ----
label {
    monitor =
    text = cmd[update:2000] [ "$(playerctl status 2>/dev/null)" = Playing ] && playerctl metadata --format '<span foreground="##cba6f7"></span>  {{ title }} · {{ artist }}' 2>/dev/null
    color = rgba(bac2deff)
    font_size = 13
    font_family = $font
    position = 0, 50
    halign = center
    valign = bottom
}
